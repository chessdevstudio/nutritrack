<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feuille — Suivi alimentaire &amp; activité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#FAF6EF;
  --surface:#FFFFFF;
  --sage:#7C9885;
  --sage-dark:#5B7A67;
  --sage-light:#E7EEE4;
  --blue:#AFC8DA;
  --blue-light:#EAF2F7;
  --cream:#F1E9DA;
  --text:#2B2723;
  --text-soft:#726B62;
  --text-faint:#A39A8E;
  --border:#E9E1D2;
  --danger:#C4694F;
  --success:#6E9C7D;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-sm:0 2px 10px rgba(60,48,32,0.05);
  --shadow-md:0 10px 30px rgba(60,48,32,0.08);
  --font-display:'Manrope', sans-serif;
  --font-body:'DM Sans', sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
input, select{font-family:inherit;}
a{color:inherit;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

/* Focus visibility for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--blue);
  outline-offset:2px;
  border-radius:8px;
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{
  max-width:1200px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.screen{
  flex:1;
  width:100%;
  padding:20px 18px 110px;
  animation:fadeUp .35s ease both;
}
@media (min-width:900px){
  .screen{padding:32px 40px 60px;}
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}

/* ============================================================
   TOP NAV (desktop) + BOTTOM NAV (mobile)
   ============================================================ */
.topnav{
  display:none;
}
@media (min-width:900px){
  .topnav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:40;
    background:rgba(250,246,239,0.9);
    backdrop-filter:blur(10px);
  }
  .topnav .brand{
    font-family:var(--font-display); font-weight:800; font-size:20px;
    display:flex; align-items:center; gap:10px;
  }
  .topnav .brand .leaf{width:26px;height:26px;}
  .topnav-links{display:flex; gap:6px;}
  .topnav-links a{
    padding:10px 16px; border-radius:100px; font-weight:700; font-size:14.5px;
    text-decoration:none; color:var(--text-soft); transition:background .15s, color .15s;
  }
  .topnav-links a.active{background:var(--sage); color:#fff;}
  .topnav-links a:not(.active):hover{background:var(--sage-light); color:var(--text);}
}

.bottomnav{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
  z-index:50;
  box-shadow:0 -4px 20px rgba(60,48,32,0.06);
}
@media (min-width:900px){ .bottomnav{display:none;} }
.bottomnav button{
  background:none; border:none; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:6px 10px; border-radius:14px; color:var(--text-faint);
  font-size:11px; font-weight:700; min-width:56px;
}
.bottomnav button.active{color:var(--sage-dark);}
.bottomnav svg{width:22px; height:22px;}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
h1,h2,h3{font-family:var(--font-display); font-weight:800; letter-spacing:-0.02em;}
.h1{font-size:28px; line-height:1.15;}
@media (min-width:900px){ .h1{font-size:36px;} }
.h2{font-size:21px; line-height:1.2;}
@media (min-width:900px){ .h2{font-size:25px;} }
.h3{font-size:17px;}
.eyebrow{
  font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--sage-dark);
}
.subtle{color:var(--text-soft); font-size:15px;}
.tiny{color:var(--text-faint); font-size:13px;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:100px; font-weight:700; font-size:15.5px;
  padding:14px 22px; min-height:48px; transition:transform .12s ease, box-shadow .12s ease, background .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--sage); color:#fff; box-shadow:0 6px 16px rgba(92,122,103,.28);}
.btn-primary:hover{background:var(--sage-dark);}
.btn-secondary{background:var(--sage-light); color:var(--sage-dark);}
.btn-secondary:hover{background:#DCE6D8;}
.btn-ghost{background:transparent; color:var(--text-soft); padding:10px 14px;}
.btn-ghost:hover{background:var(--cream);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px; min-height:36px; font-size:14px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

/* ============================================================
   CARDS / SURFACES
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:var(--shadow-sm);
}
.card-flat{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px;
}

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.field{margin-bottom:18px;}
.field label{display:block; font-weight:700; font-size:14.5px; margin-bottom:8px;}
.field input[type=number], .field input[type=text], .field select{
  width:100%; border:1.5px solid var(--border); background:var(--surface);
  border-radius:14px; padding:13px 16px; font-size:16px; color:var(--text);
}
.field input:focus, .field select:focus{border-color:var(--sage);}
.field .error-msg{color:var(--danger); font-size:13.5px; margin-top:6px; font-weight:600;}
.field.has-error input, .field.has-error select{border-color:var(--danger);}
.field .hint{font-size:13px; color:var(--text-faint); margin-top:6px;}

.choice-list{display:flex; flex-direction:column; gap:10px;}
.choice-card{
  border:1.5px solid var(--border); border-radius:16px; padding:14px 16px; text-align:left;
  background:var(--surface); display:flex; flex-direction:column; gap:3px; transition:border-color .15s, background .15s;
}
.choice-card strong{font-size:15.5px;}
.choice-card span{font-size:13.5px; color:var(--text-soft);}
.choice-card.selected{border-color:var(--sage); background:var(--sage-light);}
.choice-card:hover{border-color:var(--sage);}

.segmented{display:flex; background:var(--sage-light); border-radius:100px; padding:4px; gap:4px;}
.segmented button{
  flex:1; border:none; background:none; padding:10px 6px; border-radius:100px; font-weight:700; font-size:14px; color:var(--sage-dark);
}
.segmented button.active{background:var(--sage); color:#fff;}

/* ============================================================
   PROGRESS RING (signature element)
   ============================================================ */
.ring-wrap{position:relative; width:172px; height:172px; margin:0 auto;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--sage-light); stroke-width:14;}
.ring-fg{fill:none; stroke:var(--sage); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .6s ease;}
.ring-center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.ring-center .num{font-family:var(--font-display); font-weight:800; font-size:26px;}
.ring-center .lbl{font-size:12px; color:var(--text-soft); font-weight:600;}

/* Organic blob accent */
.blob{
  position:absolute; background:var(--sage-light); z-index:0;
  border-radius:62% 38% 55% 45% / 45% 55% 45% 55%;
  filter:blur(0px); opacity:.7;
}

/* ============================================================
   DASHBOARD HERO
   ============================================================ */
.hero-card{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--sage-light) 0%, var(--surface) 62%);
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:26px 20px 22px; text-align:center;
}
.hero-card .blob{width:200px; height:200px; top:-70px; right:-60px;}
.hero-card .blob.b2{width:140px; height:140px; bottom:-60px; left:-50px; background:var(--blue-light);}
.hero-card > *{position:relative; z-index:1;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
@media (min-width:640px){ .stat-grid{grid-template-columns:repeat(4,1fr);} }
.stat-box{
  background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 14px; text-align:center;
}
.stat-box .stat-icon{font-size:20px;}
.stat-box .stat-num{font-family:var(--font-display); font-weight:800; font-size:21px; margin-top:4px;}
.stat-box .stat-lbl{font-size:12.5px; color:var(--text-soft); font-weight:600; margin-top:2px;}

/* ============================================================
   MEAL / ACTIVITY LIST ROWS
   ============================================================ */
.section-block{margin-top:28px;}
.section-head{display:flex; align-items:center; justify-content:between; justify-content:space-between; margin-bottom:12px;}

.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 15px; margin-bottom:9px;
}
.list-row .row-main{display:flex; align-items:center; gap:12px; min-width:0;}
.list-row .row-icon{
  width:38px; height:38px; border-radius:12px; background:var(--sage-light); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
}
.list-row .row-title{font-weight:700; font-size:15px;}
.list-row .row-sub{font-size:12.5px; color:var(--text-soft);}
.list-row .row-kcal{font-weight:800; font-family:var(--font-display); font-size:15px; white-space:nowrap;}
.list-row .row-del{background:none; border:none; color:var(--text-faint); padding:6px; border-radius:8px; font-size:17px; line-height:1;}
.list-row .row-del:hover{color:var(--danger); background:#F6E9E5;}

.empty-state{
  text-align:center; padding:38px 20px; background:var(--surface); border:1.5px dashed var(--border); border-radius:20px;
}
.empty-state .emoji{font-size:34px; margin-bottom:10px;}
.empty-state p{color:var(--text-soft); font-size:14.5px; margin:6px 0 16px; max-width:320px; margin-left:auto; margin-right:auto;}

/* ============================================================
   MENUS
   ============================================================ */
.menu-cat-scroller{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;}
.menu-cat-pill{
  flex-shrink:0; border:1.5px solid var(--border); background:var(--surface); border-radius:100px; padding:9px 18px; font-weight:700; font-size:14px; color:var(--text-soft);
}
.menu-cat-pill.active{background:var(--sage); border-color:var(--sage); color:#fff;}

.recipe-grid{
  display:grid; grid-template-columns:1fr; gap:16px; margin-top:16px;
}
@media (min-width:640px){ .recipe-grid{grid-template-columns:1fr 1fr;} }
@media (min-width:1000px){ .recipe-grid{grid-template-columns:1fr 1fr 1fr;} }

.recipe-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; text-align:left; width:100%; box-shadow:var(--shadow-sm);
}
.recipe-card .thumb{
  height:118px; background:var(--sage-light); display:flex; align-items:center; justify-content:center; font-size:44px;
  background:linear-gradient(135deg, var(--sage-light), var(--blue-light));
}
.recipe-card .body{padding:15px 16px 17px;}
.recipe-card .title{font-weight:700; font-size:16px; margin-bottom:6px;}
.recipe-card .kcal{font-family:var(--font-display); font-weight:800; color:var(--sage-dark); font-size:15px; margin-bottom:10px;}
.macro-row{display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
.macro-pill{font-size:12px; color:var(--text-soft); font-weight:600;}
.recipe-card .meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-faint); margin-bottom:12px;}

/* ============================================================
   MODAL / SHEET
   ============================================================ */
.overlay{
  position:fixed; inset:0; background:rgba(35,30,24,.45); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  animation:overlayIn .2s ease both;
}
@keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
@media (min-width:640px){ .overlay{align-items:center;} }
.sheet{
  background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  border-radius:26px 26px 0 0; padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both;
}
@media (min-width:640px){ .sheet{border-radius:26px; padding:26px;} }
@keyframes sheetUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet-handle{width:40px; height:4px; background:var(--border); border-radius:10px; margin:0 auto 16px;}
@media (min-width:640px){ .sheet-handle{display:none;} }
.sheet-close{position:absolute; top:16px; right:16px; background:var(--surface); border:1px solid var(--border); width:34px; height:34px; border-radius:50%; font-size:16px;}

/* ============================================================
   TOAST
   ============================================================ */
#toast-host{position:fixed; bottom:90px; left:0; right:0; display:flex; justify-content:center; z-index:200; pointer-events:none;}
@media (min-width:900px){ #toast-host{bottom:26px;} }
.toast{
  background:var(--text); color:#fff; padding:12px 20px; border-radius:100px; font-weight:700; font-size:14px;
  display:flex; align-items:center; gap:8px; box-shadow:0 10px 26px rgba(0,0,0,.2);
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes toastIn{ from{opacity:0; transform:translateY(10px) scale(.95);} to{opacity:1; transform:translateY(0) scale(1);} }

/* ============================================================
   ONBOARDING
   ============================================================ */
.onboard-shell{
  min-height:100vh; display:flex; flex-direction:column; padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 24px);
  max-width:520px; margin:0 auto;
}
.onboard-progress{display:flex; gap:6px; margin-bottom:28px;}
.onboard-progress .seg{height:5px; flex:1; background:var(--border); border-radius:10px; overflow:hidden;}
.onboard-progress .seg.done{background:var(--sage);}
.onboard-body{flex:1;}
.onboard-nav{display:flex; gap:10px; margin-top:26px;}

.level-desc{font-size:13px; color:var(--text-soft); margin-top:2px;}

.result-ring-screen{text-align:center; padding-top:10px;}
.result-badge{
  display:inline-flex; align-items:center; gap:8px; background:var(--sage-light); color:var(--sage-dark);
  padding:7px 16px; border-radius:100px; font-weight:700; font-size:13px; margin-bottom:20px;
}

/* ============================================================
   PROFILE
   ============================================================ */
.profile-row{display:flex; align-items:center; justify-content:space-between; padding:15px 4px; border-bottom:1px solid var(--border);}
.profile-row:last-child{border-bottom:none;}
.profile-row .lbl{color:var(--text-soft); font-size:14.5px;}
.profile-row .val{font-weight:700; font-size:15px;}

/* ============================================================
   MISC
   ============================================================ */
.disclaimer{
  background:var(--blue-light); border-radius:16px; padding:14px 16px; font-size:13px; color:var(--text-soft); line-height:1.55; margin-top:22px;
  display:flex; gap:10px; align-items:flex-start;
}
.disclaimer .ico{flex-shrink:0; font-size:16px;}

.date-strip{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.date-strip .nav-btn{background:var(--surface); border:1px solid var(--border); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;}

.ingredient-row{display:grid; grid-template-columns:1fr 90px 34px; gap:8px; margin-bottom:9px; align-items:center;}
.ingredient-row select, .ingredient-row input{padding:10px 12px; font-size:14px;}
.ingredient-row .rm-ing{background:var(--cream); border:none; border-radius:10px; height:38px; font-size:16px; color:var(--text-soft);}

.badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--cream); color:var(--text-soft);}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-host"></div>

<script>
"use strict";

/* ============================================================
   1) DATA — FOODS DATABASE (per 100g / 100ml)
   Source: ordres de grandeur usuels (tables nutritionnelles génériques).
   Ces valeurs sont des estimations, cf. mention légale dans l'app.
   ============================================================ */
const FOODS_DB = [
  {id:"avoine", name:"Flocons d'avoine", kcal:389, protein:16.9, carbs:66.3, fat:6.9},
  {id:"lait", name:"Lait demi-écrémé", kcal:46, protein:3.3, carbs:4.8, fat:1.6},

  {id:"yaourt_grec", name:"Yaourt grec", kcal:97, protein:9, carbs:3.6, fat:5},
  {id:"quinoa", name:"Quinoa cuit", kcal:120, protein:4.4, carbs:21.3, fat:1.9},

  {id:"thon", name:"Thon (conserve, au naturel)", kcal:116, protein:25.5, carbs:0, fat:0.8},
  {id:"pomme", name:"Pomme", kcal:52, protein:0.3, carbs:13.8, fat:0.2},
  {id:"beurre_cacahuete", name:"Beurre de cacahuète", kcal:588, protein:25, carbs:20, fat:50},
  {id:"courgette", name:"Courgette", kcal:17, protein:1.2, carbs:3.1, fat:0.3},
  {id:"champignons", name:"Champignons", kcal:22, protein:3.1, carbs:3.3, fat:0.3},
  {id:"jambon", name:"Jambon blanc", kcal:145, protein:20, carbs:1.5, fat:6},
  {id:"pates_completes", name:"Pâtes complètes cuites", kcal:124, protein:5, carbs:25, fat:1},
  {id:"haricots_verts", name:"Haricots verts", kcal:31, protein:1.8, carbs:7, fat:0.1},
  {id:"carotte", name:"Carotte", kcal:41, protein:0.9, carbs:10, fat:0.2},
  {id:"graines_chia", name:"Graines de chia", kcal:486, protein:17, carbs:42, fat:31}
];
const foodById = id => FOODS_DB.find(f => f.id === id);

/* ============================================================
   2) DATA — MENUS (recettes prédéfinies)
   ============================================================ */
const MENUS = [
  // ---- PETIT-DÉJEUNER ----

   4) CALCULATIONS — fonctions isolées et testables
   ============================================================ */

// Formule de Mifflin-St Jeor pour le métabolisme de base (BMR)
function calculateBMR({age, sex, height, weight}){
  const base = 10 * weight + 6.25 * height - 5 * age;
  if(sex === "homme") return base + 5;
  if(sex === "femme") return base - 161;
  return base - 78; // moyenne pour "autre / préfère ne pas dire"
}

// Besoin énergétique quotidien estimé (TDEE)
function calculateDailyEnergyNeeds({age, sex, height, weight, activityLevel}){
  const bmr = calculateBMR({age, sex, height, weight});
  const level = levelById(activityLevel) || ACTIVITY_LEVELS[0];
  return Math.round(bmr * level.factor);
}

// Calories/macros totales d'une recette à partir de ses ingrédients
function calculateRecipeTotals(ingredients){
  return ingredients.reduce((tot, ing) => {
    const food = foodById(ing.food);
    if(!food) return tot;
    const factor = ing.g / 100;
    tot.kcal += food.kcal * factor;
    tot.protein += food.protein * factor;
    tot.carbs += food.carbs * factor;
    tot.fat += food.fat * factor;
    return tot;
  }, {kcal:0, protein:0, carbs:0, fat:0});
}

function calculateCaloriesPerPortion(totals, portions){
  if(!portions || portions <= 0) return totals;
  return {
    kcal: totals.kcal / portions,
    protein: totals.protein / portions,
    carbs: totals.carbs / portions,
    fat: totals.fat / portions
  };
}

// Calories dépensées à partir du MET, du poids et de la durée
function calculateBurnedCalories({weight, met, durationMin, intensity}){
  const intensityFactor = intensity === "leger" ? 0.8 : intensity === "intense" ? 1.2 : 1.0;
  const adjustedMet = met * intensityFactor;
  return (adjustedMet * 3.5 * weight / 200) * durationMin;
}

function calculateDailyTotal(day){
  const consumed = (day.meals || []).reduce((s,m) => s + m.kcal, 0);
  const burned = (day.activities || []).reduce((s,a) => s + a.kcal, 0);
  return {consumed: Math.round(consumed), burned: Math.round(burned)};
}

function calculateWeeklyAverage(days){
  const vals = Object.values(days);
  if(!vals.length) return {avgConsumed:0, avgBurned:0, count:0};
  let c=0,b=0;
  vals.forEach(d => { const t = calculateDailyTotal(d); c += t.consumed; b += t.burned; });
  return {avgConsumed: Math.round(c/vals.length), avgBurned: Math.round(b/vals.length), count: vals.length};
}

/* ============================================================
   6) UTIL
   ============================================================ */
function todayStr(){
  const d = new Date();
  return formatDateISO(d);
}
function formatDateISO(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function formatDateHuman(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const opts = {weekday:"long", day:"numeric", month:"long"};
  const s = d.toLocaleDateString("fr-FR", opts);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function addDays(dateStr, n){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return formatDateISO(d);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function round(n){ return Math.round(n); }
function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function showToast(msg, icon){
  const host = document.getElementById("toast-host");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${icon||"✓"}</span><span>${esc(msg)}</span>`;
  host.innerHTML = "";
  host.appendChild(el);
  setTimeout(() => { el.remove(); }, 2400);
}

  const progressSegs = Array.from({length: total}, (_,i) => `<div class="seg ${i < step ? 'done':''}"></div>`).join("");

  return `
  <div class="onboard-shell">
    <div class="onboard-progress">${progressSegs}</div>
    <div class="onboard-body">${body}</div>
    <div class="onboard-nav">
      ${step > 1 ? `<button class="btn btn-secondary" id="ob-back">Retour</button>` : ""}
      ${step < 4 ? `<button class="btn btn-primary btn-block" id="ob-next">Continuer</button>` : `<button class="btn btn-primary btn-block" id="ob-finish">Découvrir mes menus</button>`}
    </div>
  </div>`;
}

function bindOnboarding(){
  const app = document.getElementById("app");

  app.querySelectorAll(".sex-choice").forEach(btn => {
    btn.addEventListener("click", () => { State.onboardData.sex = btn.dataset.sex; render(); });
  });
  app.querySelectorAll(".level-choice").forEach(btn => {
    btn.addEventListener("click", () => { State.onboardData.activityLevel = btn.dataset.level; render(); });
  });

  const back = document.getElementById("ob-back");
  if(back) back.addEventListener("click", () => { State.onboardStep--; render(); });

  const next = document.getElementById("ob-next");
  if(next) next.addEventListener("click", onboardValidateAndNext);

  const finish = document.getElementById("ob-finish");
  if(finish) finish.addEventListener("click", () => {
    Storage.setProfile({
      age: Number(State.onboardData.age),
      sex: State.onboardData.sex,
      height: Number(State.onboardData.height),
      weight: Number(State.onboardData.weight),
      activityLevel: State.onboardData.activityLevel
    });
    Storage.setOnboarded();
    State.route = "dashboard";
    render();
  });
}

function fieldError(fieldId, msg){
  const field = document.getElementById(fieldId);
  if(!field) return;
  field.classList.add("has-error");
  const em = field.querySelector(".error-msg");
  em.textContent = msg;
  em.style.display = "block";
}
function clearFieldError(fieldId){
  const field = document.getElementById(fieldId);
  if(!field) return;
  field.classList.remove("has-error");
  const em = field.querySelector(".error-msg");
  if(em) em.style.display = "none";
}

function onboardValidateAndNext(){
  const step = State.onboardStep;
  let valid = true;

  if(step === 1){
    const ageVal = document.getElementById("input-age").value.trim();
    const age = Number(ageVal);
    clearFieldError("field-age");
    if(!ageVal || isNaN(age) || age <= 0 || age > 120){
      fieldError("field-age", "Veuillez renseigner un âge valide.");
      valid = false;
    } else {
      State.onboardData.age = age;
    }
  }

  if(step === 2){
    clearFieldError("field-height"); clearFieldError("field-weight");
    const heightVal = Number(document.getElementById("input-height").value);
    const weightVal = Number(document.getElementById("input-weight").value);
    if(!heightVal || heightVal <= 0 || heightVal > 260){
      fieldError("field-height", "Veuillez renseigner une taille valide.");
      valid = false;
    } else { State.onboardData.height = heightVal; }
    if(!weightVal || weightVal <= 0 || weightVal > 400){
      fieldError("field-weight", "Indiquez votre poids pour effectuer l'estimation.");
      valid = false;
    } else { State.onboardData.weight = weightVal; }
    if(!State.onboardData.sex){
      valid = false;
      showToast("Veuillez choisir une option.", "⚠️");
    }
  }

  if(step === 3){
    if(!State.onboardData.activityLevel){
      document.getElementById("level-error").style.display = "block";
      valid = false;
    }
  }

  if(valid){
    State.onboardStep++;
    render();
  }
}

function groupMealsByCategory(meals){
  const cats = {"petit-dejeuner":[], "dejeuner":[], "diner":[], "collation":[]};
  (meals||[]).forEach(m => { if(cats[m.category]) cats[m.category].push(m); else cats.collation.push(m); });
  return cats;
}

const CAT_LABELS = {"petit-dejeuner":"Petit-déjeuner","dejeuner":"Déjeuner","diner":"Dîner","collation":"Collation"};
const CAT_ICONS = {"petit-dejeuner":"🌅","dejeuner":"☀️","diner":"🌙","collation":"🍎"};

function renderMealsForDashboard(grouped){
  const cats = ["petit-dejeuner","dejeuner","diner","collation"];
  const anyMeal = cats.some(c => grouped[c].length);
  if(!anyMeal){
    return `
      <div class="empty-state">
        <div class="emoji">🍽️</div>
        <p>Aucun repas enregistré pour cette journée. Ajoutez un menu ou une recette pour commencer.</p>
        <button class="btn btn-primary btn-sm" data-nav="menus">+ Ajouter un repas</button>
      </div>`;
  }
  return cats.map(c => {
    if(!grouped[c].length) return "";
    return grouped[c].map(m => renderMealRow(m)).join("");
  }).join("");
}

function renderMealRow(m){
  return `
  <div class="list-row" data-meal-row="${m.id}">

/* ============================================================
   15) EVENT BINDING
   ============================================================ */
function bindGlobalEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      navigate(el.dataset.nav);
    });
  });

  // Dashboard date navigation
  const prev = document.getElementById("date-prev");
  if(prev) prev.addEventListener("click", () => { State.selectedDate = addDays(State.selectedDate,-1); render(); });
  const next = document.getElementById("date-next");
  if(next) next.addEventListener("click", () => {
    const n = addDays(State.selectedDate,1);
    if(n <= todayStr()){ State.selectedDate = n; render(); }
  });
  const todayBtn = document.getElementById("date-today");
  if(todayBtn) todayBtn.addEventListener("click", () => { State.selectedDate = todayStr(); render(); });

  // Delete meal / activity
  app.querySelectorAll("[data-del-meal]").forEach(btn => {
    btn.addEventListener("click", () => {
      const day = Storage.getDay(State.selectedDate);
      day.meals = day.meals.filter(m => m.id !== btn.dataset.delMeal);
      Storage.setDay(State.selectedDate, day);
      showToast("Repas supprimé", "🗑️");
      render();
    });
  });
  app.querySelectorAll("[data-del-activity]").forEach(btn => {
    btn.addEventListener("click", () => {
      const day = Storage.getDay(State.selectedDate);
      day.activities = day.activities.filter(a => a.id !== btn.dataset.delActivity);
      Storage.setDay(State.selectedDate, day);
      showToast("Activité supprimée", "🗑️");
      render();
    });
  });

  // Menu category pills
  app.querySelectorAll("[data-menu-cat]").forEach(btn => {
    btn.addEventListener("click", () => { State.menuCat = btn.dataset.menuCat; render(); });
  });

  // Open menu detail modal
  app.querySelectorAll("[data-open-menu]").forEach(btn => {
    btn.addEventListener("click", () => { State.activeMenuModal = btn.dataset.openMenu; render(); });
  });
  const closeMenuModal = document.getElementById("close-menu-modal");
  if(closeMenuModal) closeMenuModal.addEventListener("click", () => { State.activeMenuModal = null; render(); });
  const menuOverlay = document.getElementById("menu-overlay");
  if(menuOverlay) menuOverlay.addEventListener("click", (e) => { if(e.target === menuOverlay){ State.activeMenuModal = null; render(); } });

  bindPortionControls();
  bindAddMealButton();

  // Activity modal open
  ["open-activity-modal","open-activity-modal-2","open-activity-modal-main"].forEach(id => {
    const b = document.getElementById(id);
    if(b) b.addEventListener("click", () => { State.activeActivityModal = true; render(); });
  });
  const closeActivityModal = document.getElementById("close-activity-modal");
  if(closeActivityModal) closeActivityModal.addEventListener("click", () => { State.activeActivityModal = false; render(); });
  const activityOverlay = document.getElementById("activity-overlay");
  if(activityOverlay) activityOverlay.addEventListener("click", (e) => { if(e.target === activityOverlay){ State.activeActivityModal = false; render(); } });

  bindActivityModalLogic();

  // Profile edit
  const pfEdit = document.getElementById("pf-edit");
  if(pfEdit) pfEdit.addEventListener("click", () => { State.editingProfile = true; render(); });
  const pfCancel = document.getElementById("pf-cancel");
  if(pfCancel) pfCancel.addEventListener("click", () => { State.editingProfile = false; render(); });
  const pfSave = document.getElementById("pf-save");
  if(pfSave) pfSave.addEventListener("click", saveProfileEdits);

  app.querySelectorAll(".pf-sex-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = Storage.getProfile(); p.sex = btn.dataset.sex; Storage.setProfile(p); render();
    });
  });
  app.querySelectorAll(".pf-level-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = Storage.getProfile(); p.activityLevel = btn.dataset.level; Storage.setProfile(p); render();
    });
  });
}

function bindPortionControls(){
  const input = document.getElementById("portion-input");
  if(!input) return;
  const minus = document.getElementById("portion-minus");
  const plus = document.getElementById("portion-plus");
  minus.addEventListener("click", () => {
    let v = Math.max(0.5, (Number(input.value)||1) - 0.5);
    input.value = v;
  });
  plus.addEventListener("click", () => {
    let v = (Number(input.value)||1) + 0.5;
    input.value = v;
  });
}

function bindAddMealButton(){
  const btn = document.getElementById("add-meal-to-day");
  if(!btn) return;
  btn.addEventListener("click", () => {
    const menuId = btn.dataset.menuId;
    const menu = MENUS.find(m => m.id === menuId);
    const portionsInput = document.getElementById("portion-input");
    const portions = Number(portionsInput.value);
    const errBox = document.getElementById("portion-error");

    if(!portions || portions <= 0){
      errBox.textContent = "Veuillez renseigner une quantité supérieure à 0.";
      errBox.style.display = "block";
      return;
    }
    errBox.style.display = "none";

    const totals = calculateRecipeTotals(menu.ingredients);
    const day = Storage.getDay(State.selectedDate);
    day.meals = day.meals || [];
    day.meals.push({
      id: uid(),
      name: menu.name,
      category: menu.cat,
      portions: portions,
      kcal: totals.kcal * portions,
      protein: totals.protein * portions,
      carbs: totals.carbs * portions,
      fat: totals.fat * portions
    });
    Storage.setDay(State.selectedDate, day);
    State.activeMenuModal = null;
    State.route = "dashboard";
    render();
    showToast("Repas ajouté à votre journée", "✓");
  });
}

function bindActivityModalLogic(){
  const list = document.getElementById("activity-type-list");
  if(!list) return;

  let selectedActivity = null;

  const durationInput = document.getElementById("input-duration");
  const intensityField = document.getElementById("field-intensity");
  const preview = document.getElementById("activity-preview");
  const previewKcal = document.getElementById("activity-preview-kcal");
  const confirmBtn = document.getElementById("confirm-add-activity");
  let selectedIntensity = "modere";

  function needsIntensity(id){
    return ["marche","course","velo","natation","danse"].includes(id);
  }

  function updatePreview(){
    const profile = Storage.getProfile();
    const duration = Number(durationInput.value);
    if(!selectedActivity || !duration || duration <= 0){
      preview.style.display = "none";
      confirmBtn.disabled = true;
      return;
    }
    const act = activityById(selectedActivity);
    const kcal = calculateBurnedCalories({weight: profile.weight, met: act.met, durationMin: duration, intensity: selectedIntensity});
    previewKcal.textContent = `≈ ${round(kcal)} kcal`;
    preview.style.display = "block";
    confirmBtn.disabled = false;
  }

  list.querySelectorAll(".activity-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedActivity = btn.dataset.activity;
      list.querySelectorAll(".activity-choice").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      intensityField.style.display = needsIntensity(selectedActivity) ? "block" : "none";
      updatePreview();
    });
  });

  durationInput.addEventListener("input", updatePreview);

  document.querySelectorAll(".intensity-choice").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".intensity-choice").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedIntensity = btn.dataset.intensity;
      updatePreview();
    });
  });

  confirmBtn.addEventListener("click", () => {
    const duration = Number(durationInput.value);
    if(!selectedActivity){
      showToast("Choisissez un type d'activité.", "⚠️");
      return;
    }
    if(!duration || duration <= 0){
      fieldError("field-duration", "Veuillez renseigner une durée valide.");
      return;
    }
    const profile = Storage.getProfile();
    const act = activityById(selectedActivity);
    const kcal = calculateBurnedCalories({weight: profile.weight, met: act.met, durationMin: duration, intensity: selectedIntensity});

    const day = Storage.getDay(State.selectedDate);
    day.activities = day.activities || [];
    day.activities.push({
      id: uid(),
      activityId: selectedActivity,
      name: act.name,
      duration: duration,
      kcal: kcal
    });
    Storage.setDay(State.selectedDate, day);
    State.activeActivityModal = false;
    render();
    showToast("Activité ajoutée à votre journée", "✓");
  });
}

function saveProfileEdits(){
  const p = Storage.getProfile();
  clearFieldError("pf-field-age"); clearFieldError("pf-field-height"); clearFieldError("pf-field-weight");

  const age = Number(document.getElementById("pf-age").value);
  const height = Number(document.getElementById("pf-height").value);
  const weight = Number(document.getElementById("pf-weight").value);
  let valid = true;

  if(!age || age <= 0 || age > 120){ fieldError("pf-field-age","Veuillez renseigner un âge valide."); valid = false; }
  if(!height || height <= 0 || height > 260){ fieldError("pf-field-height","Veuillez renseigner une taille valide."); valid = false; }
  if(!weight || weight <= 0 || weight > 400){ fieldError("pf-field-weight","Indiquez votre poids pour effectuer l'estimation."); valid = false; }

  if(!valid) return;

  p.age = age; p.height = height; p.weight = weight;
  Storage.setProfile(p);
  State.editingProfile = false;
  render();
  showToast("Profil mis à jour", "✓");
}

/* ============================================================
   16) INIT
   ============================================================ */
render();
</script>
